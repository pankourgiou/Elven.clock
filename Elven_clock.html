<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season Clock</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: url("Seasons.jpg") no-repeat center center;
        background-size: contain;        /* Show entire image */
        background-color: #000;
        display: flex;
        justify-content: flex-end;       /* RIGHT side */
        align-items: center;             /* Vertically centered */
        padding-right: 60px;
        font-family: "Times New Roman", serif;
    }

    .clock {
        width: 240px;
        height: 240px;
        border-radius: 50%;
        position: relative;
        border: 2px solid rgba(255,255,255,0.7);
        background: rgba(0,0,0,0.35);
        backdrop-filter: blur(4px);
    }

    .number {
        position: absolute;
        width: 100%;
        height: 100%;
        text-align: center;
        transform: rotate(var(--rotation));
        font-size: 16px;
        color: white;
    }

    .number span {
        display: inline-block;
        transform: rotate(calc(-1 * var(--rotation)));
    }

    /* Slight variation for visual character */
    .number:nth-child(3n) span {
        font-style: italic;
        opacity: 0.8;
    }

    .hand {
        position: absolute;
        bottom: 50%;
        left: 50%;
        transform-origin: bottom;
        transform: translateX(-50%) rotate(0deg);
        background: white;
        border-radius: 4px;
    }

    .hour {
        width: 4px;
        height: 65px;
    }

    .minute {
        width: 3px;
        height: 95px;
    }

    .second {
        width: 2px;
        height: 105px;
        background: #ccc;
    }

    .center-dot {
        position: absolute;
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>
</head>

<body>

<div class="clock" id="clock">
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="center-dot"></div>
</div>

<script>
    const clock = document.getElementById("clock");

    // Create numbers
    for (let i = 1; i <= 12; i++) {
        const number = document.createElement("div");
        number.classList.add("number");
        number.style.setProperty("--rotation", i * 30 + "deg");

        const span = document.createElement("span");
        span.textContent = i;

        number.appendChild(span);
        clock.appendChild(number);
    }

    function setClock() {
        const now = new Date();

        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours() % 12;

        const secondDeg = seconds * 6;
        const minuteDeg = minutes * 6 + seconds * 0.1;
        const hourDeg = hours * 30 + minutes * 0.5;

        document.getElementById("second").style.transform =
            `translateX(-50%) rotate(${secondDeg}deg)`;

        document.getElementById("minute").style.transform =
            `translateX(-50%) rotate(${minuteDeg}deg)`;

        document.getElementById("hour").style.transform =
            `translateX(-50%) rotate(${hourDeg}deg)`;
    }

    setInterval(setClock, 1000);
    setClock();
</script>

</body>
</html>
